name: Role composition offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  roles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - name: Check private dependency access
        env:
          READ_TOKEN: ${{ secrets.MARKET_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::Configure MARKET_SOURCE_READ_TOKEN with read access to all three market source repositories."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MARKET_SOURCE_READ_TOKEN }}
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -B roles/validate_repository.py
